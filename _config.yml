# GitHub Pages / Jekyll configuration.
#
# The site is plain static HTML - nothing here asks Jekyll to render anything.
# This file exists to be explicit about what must NOT be published.
#
# assets/images/_src holds the pristine, unoptimised originals that
# tools/build-images.py compresses from. Keeping them in the repo is what makes
# that script idempotent: it always re-derives from the original instead of
# re-compressing an already-compressed file and losing quality a little more on
# every run. They are build inputs, not site content, and must never be served.
#
# Jekyll already skips paths whose name begins with an underscore, so this is
# belt and braces - but the rule is worth stating where someone will find it,
# rather than leaving 7 MB of originals protected by a naming convention.
exclude:
  - assets/images/_src
  - tools
  - README.md
